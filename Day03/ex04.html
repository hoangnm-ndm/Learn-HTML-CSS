<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      .container {
        border: 2px solid red;
        display: flex;
        /* kỹ thuật flex-box phát huy sức mạnh khi sử dụng layout theo một chiều */
        flex-wrap: wrap;
        /* khi hết chỗ thì xuống dòng */
        flex-direction: row;
        justify-content: space-between;
        column-gap: 32px;
      }

      .item {
        border: 2px dashed blue;
        padding: 8px;
        /* flex-basis: 200px;
        flex-grow: 1;
        flex-shrink: 1; */
        flex: 1 1 1;
        min-width: 200px;
        min-height: 100px;
        /* shorthand syntax */
        background-color: orange;
      }
      img {
        width: 100%;
      }

      @media screen and (max-width: 800px) {
        .item {
          min-width: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item"><img src="./image.png" alt="" /></div>
      <div class="item"><img src="./image.png" alt="" /></div>
      <div class="item"><img src="./image.png" alt="" /></div>
      <div class="item"><img src="./image.png" alt="" /></div>
    </div>
  </body>
</html>
